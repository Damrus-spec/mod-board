<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #12161c; --panel: #181d25; --panel2: #1f2530; --line: #2b3240; --text: #e6e9ef; --muted: #8b94a5;
  --accent: #4cc2ff; --accent-ink: #06202e; --epic: #e5488f; --story: #3fa7c9; --sub: #8b94a5; --bug: #ef5350;
  --decision: #f0a030; --review: #b388ff; --ok: #4caf50; --claude: #9c7cff; --p1: #f0c040; --p2: #c8a040; --p3: #6b7280;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
button, select, input, textarea { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; }
button { padding: 6px 12px; cursor: pointer; } button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
input, select { padding: 6px 8px; } textarea { padding: 8px; width: 100%; resize: vertical; }
a { color: var(--accent); }
header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
header .grow { flex: 1; }
#status { color: var(--muted); font-size: 12px; }
main { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr); height: calc(100% - 56px); }
#list { overflow: auto; border-right: 1px solid var(--line); }
#detail { overflow: auto; padding: 16px 20px 40px; }
.listbar { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 18px auto 1fr auto auto; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--panel); } .row.sel { background: var(--panel2); box-shadow: inset 3px 0 var(--accent); }
.row .tw { color: var(--muted); font-size: 11px; text-align: center; }
.row .t { min-width: 0; } .row .t b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .t small { color: var(--muted); } .row.closed .t b { text-decoration: line-through; color: var(--muted); }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 10px; border: 1px solid; text-transform: uppercase; white-space: nowrap; }
.b-epic { color: #fff; background: var(--epic); border-color: var(--epic); } .b-story { color: var(--story); }
.b-subtask { color: var(--sub); } .b-bug { color: var(--bug); } .b-decision { color: var(--decision); } .b-review { color: var(--review); }
.pill { font-size: 11px; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
.pill.P1 { color: var(--p1); border-color: var(--p1); } .pill.P2 { color: var(--p2); border-color: var(--p2); }
.st { font-size: 11px; color: var(--claude); margin-left: 6px; } .st.ready { color: var(--ok); } .st.failed { color: var(--bug); } .st.for-damrus { color: var(--decision); }
.prog { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.prog i { display: block; width: 70px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog i::after { content: ""; display: block; height: 100%; width: var(--p); background: var(--ok); }
.indent1 { padding-left: 34px; } .indent2 { padding-left: 56px; }
.empty { color: var(--muted); padding: 30px; text-align: center; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.grid label, .field label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; } .grid select, .grid input { width: 100%; }
.field { margin: 12px 0; } #f-title { width: 100%; font-size: 18px; font-weight: 600; padding: 8px 10px; }
.toprow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.toprow .grow { flex: 1; }
.box { border: 1px solid var(--claude); border-radius: 8px; padding: 12px 14px; margin: 18px 0; background: color-mix(in srgb, var(--claude) 7%, transparent); }
.box h3, .sec { font-size: 12px; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; }
.box .head { display: flex; gap: 10px; align-items: center; } .box .head b { flex: 1; }
.drop { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; text-align: center; color: var(--muted); }
.shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; } .shots img { max-height: 120px; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; }
.comment { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: var(--panel); }
.comment .who { font-size: 12px; color: var(--muted); padding: 6px 10px; border-bottom: 1px solid var(--line); }
.comment .who .tc { color: var(--claude); } .comment .md { padding: 4px 12px; overflow-x: auto; }
.md img { max-width: 100%; } .md pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; }
.dirty { color: var(--decision); }
#login { max-width: 520px; margin: 60px auto; padding: 0 16px; } #login input { width: 100%; margin: 4px 0 12px; }
#back { display: none; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; } #detail { display: none; } body.showdetail #list { display: none; }
  body.showdetail #detail { display: block; } #back { display: inline-block; } .grid { grid-template-columns: 1fr 1fr; }
  .row .prog i { display: none; }
}
</style>
</head>
<body>
<div id="login" hidden>
  <h1>Mod Tracker</h1>
  <p>Paste a GitHub fine-grained token with access to the tracker repo only (Issues: read and write, Contents: read and write). It is stored in this browser only.</p>
  <label>Owner</label><input id="l-owner" placeholder="github login">
  <label>Repo</label><input id="l-repo" value="cosmoteer-mods-tracker">
  <label>Token</label><input id="l-token" type="password" placeholder="github_pat_...">
  <button class="primary" onclick="saveLogin()">Connect</button>
</div>
<div id="app" hidden>
<header>
  <h1>Mod Tracker</h1>
  <div class="tabs" id="tabs"></div>
  <select id="f-mod"><option value="">All mods</option></select>
  <input id="search" placeholder="Search… ( / )" style="width:160px">
  <span class="grow"></span>
  <span id="status"></span>
  <button class="primary" onclick="newIssue()">+ New issue</button>
  <button onclick="load()" title="Reload">⟳</button>
  <button onclick="logout()" title="Forget token">⏏</button>
</header>
<main>
  <section id="list"></section>
  <section id="detail"><div class="empty">Select an issue.</div></section>
</main>
</div>
<script>
"use strict";
const TYPES = ["epic", "story", "subtask", "bug", "decision", "review"];
const TABS = [
  ["roadmap", "Roadmap", i => i.state === "OPEN" && !has(i, "later")],
  ["claude", "Claude", i => i.state === "OPEN" && (has(i, "claude") || has(i, "working") || has(i, "failed"))],
  ["me", "For me", i => i.state === "OPEN" && (has(i, "for-damrus") || has(i, "ready"))],
  ["later", "Later", i => i.state === "OPEN" && has(i, "later")],
  ["done", "Done", i => i.state === "CLOSED"],
  ["all", "All", () => true],
];
const NOTES = "\n\n## Notes for Claude\n";
const TO_CLAUDE = "<!-- to-claude -->";
let cfg = {}, issues = [], byNum = {}, tab = "roadmap", sel = null, open = {}, dirty = false;
try { cfg = JSON.parse(localStorage.getItem("tracker.cfg") || "{}"); open = JSON.parse(localStorage.getItem("tracker.open") || "{}"); tab = localStorage.getItem("tracker.tab") || tab; } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const has = (i, l) => i.labels.includes(l);
const typeOf = i => (i.labels.find(l => l.startsWith("type:")) || "type:story").slice(5);
const prioOf = i => i.labels.find(l => /^P[123]$/.test(l)) || "P2";
const modOf = i => { for (let x = i, n = 0; x && n < 10; x = byNum[x.parent], n++) { const m = x.labels.find(l => l.startsWith("mod:")); if (m) return m.slice(4); } return ""; };
const claudeState = i => ["working", "failed", "claude", "for-damrus", "ready"].find(l => has(i, l)) || "";
const STATE_TEXT = { claude: "Queued for Claude", working: "Claude is working", failed: "Worker failed", "for-damrus": "Needs you", ready: "Ready to test", "": "Not assigned" };

function saveLogin() {
  cfg = { owner: $("l-owner").value.trim(), repo: $("l-repo").value.trim(), token: $("l-token").value.trim() };
  try { localStorage.setItem("tracker.cfg", JSON.stringify(cfg)); } catch (e) {}
  start();
}
function logout() { try { localStorage.removeItem("tracker.cfg"); } catch (e) {} location.reload(); }
function status(t) { $("status").textContent = t; }

async function api(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, { ...opts, headers: {
    Authorization: "Bearer " + cfg.token, Accept: opts.accept || "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 200)}`);
  if (opts.accept === "application/vnd.github.raw") return r.blob();
  return r.status === 204 ? null : r.json();
}
async function gql(query, variables) {
  const r = await api("/graphql", { method: "POST", body: JSON.stringify({ query, variables }) });
  if (r.errors) throw new Error(r.errors.map(e => e.message).join("; "));
  return r.data;
}
const R = () => `/repos/${cfg.owner}/${cfg.repo}`;

async function load() {
  status("Loading…");
  try {
    const all = []; let cursor = null;
    do {
      const d = await gql(`query($o:String!,$n:String!,$c:String){repository(owner:$o,name:$n){
        issues(first:100,after:$c,orderBy:{field:CREATED_AT,direction:ASC}){pageInfo{hasNextPage endCursor}
          nodes{id databaseId number title body state createdAt updatedAt url
            labels(first:30){nodes{name}} parent{number} subIssuesSummary{total completed} comments{totalCount}}}}}`,
        { o: cfg.owner, n: cfg.repo, c: cursor });
      const p = d.repository.issues;
      p.nodes.forEach(i => { i.labels = i.labels.nodes.map(l => l.name); i.parent = i.parent && i.parent.number; });
      all.push(...p.nodes); cursor = p.pageInfo.hasNextPage ? p.pageInfo.endCursor : null;
    } while (cursor);
    issues = all; byNum = Object.fromEntries(all.map(i => [i.number, i]));
    const mods = [...new Set(all.map(modOf).filter(Boolean))].sort();
    const fm = $("f-mod"), cur = fm.value;
    fm.innerHTML = `<option value="">All mods</option>` + mods.map(m => `<option>${esc(m)}</option>`).join("");
    fm.value = cur;
    status("Connected: " + cfg.owner + "/" + cfg.repo);
    renderTabs(); renderList();
    if (sel && byNum[sel] && !dirty) renderDetail(byNum[sel]);
  } catch (e) { status("Error: " + e.message); }
}

function visible(i) {
  const q = $("search").value.trim().toLowerCase(), m = $("f-mod").value;
  return (!m || modOf(i) === m) && (!q || (`#${i.number} ${i.title} ${i.body}`).toLowerCase().includes(q));
}
function renderTabs() {
  $("tabs").innerHTML = TABS.map(([k, name, f]) =>
    `<button class="${k === tab ? "on" : ""}" onclick="setTab('${k}')">${name} ${issues.filter(i => f(i) && visible(i)).length}</button>`).join("");
}
function setTab(k) { tab = k; try { localStorage.setItem("tracker.tab", k); } catch (e) {} renderTabs(); renderList(); }

function prioRank(i) { return { P1: 0, P2: 1, P3: 2 }[prioOf(i)]; }
function sortIssues(a, b) { return prioRank(a) - prioRank(b) || a.number - b.number; }
function rowHtml(i, depth) {
  const kids = issues.filter(c => c.parent === i.number).length;
  const t = typeOf(i), s = claudeState(i), sum = i.subIssuesSummary || { total: 0, completed: 0 };
  const pct = sum.total ? Math.round(100 * sum.completed / sum.total) : 0;
  return `<div class="row ${depth ? "indent" + depth : ""} ${i.state === "CLOSED" ? "closed" : ""} ${sel === i.number ? "sel" : ""}" onclick="pick(${i.number})">
    <span class="tw" onclick="event.stopPropagation();toggle(${i.number})">${kids && tab === "roadmap" ? (open[i.number] ? "▾" : "▸") : ""}</span>
    <span class="badge b-${t}">${t}</span>
    <span class="t"><b>${esc(i.title)}</b><small>#${i.number} ${esc(modOf(i))}${s ? `<span class="st ${s}">${STATE_TEXT[s]}</span>` : ""}</small></span>
    <span class="prog" style="--p:${pct}%">${sum.total ? `<i></i>${sum.completed}/${sum.total}` : ""}</span>
    <span class="pill ${prioOf(i)}">${prioOf(i)}</span></div>`;
}
function renderList() {
  const f = TABS.find(t => t[0] === tab)[2];
  let html = `<div class="listbar">${tab === "roadmap" ? `<button onclick="expand(true)">Expand all</button><button onclick="expand(false)">Collapse all</button>` : ""}</div>`;
  if (tab === "roadmap") {
    const shown = i => f(i) && visible(i);
    const walk = (i, d) => {
      const kids = issues.filter(c => c.parent === i.number && f(c)).sort(sortIssues);
      let h = rowHtml(i, d);
      if (open[i.number]) kids.forEach(k => h += walk(k, Math.min(d + 1, 2)));
      return h;
    };
    // Roots: open issues whose parent is not open on this tab (epics first).
    const roots = issues.filter(i => shown(i) && !(i.parent && byNum[i.parent] && f(byNum[i.parent])))
      .sort((a, b) => (typeOf(b) === "epic") - (typeOf(a) === "epic") || sortIssues(a, b));
    roots.forEach(r => html += walk(r, 0));
    if (!roots.length) html += `<div class="empty">Nothing here.</div>`;
  } else {
    const rows = issues.filter(i => f(i) && visible(i)).sort(sortIssues);
    html += rows.map(i => rowHtml(i, 0)).join("") || `<div class="empty">Nothing here.</div>`;
  }
  $("list").innerHTML = html;
}
function toggle(n) { open[n] = !open[n]; try { localStorage.setItem("tracker.open", JSON.stringify(open)); } catch (e) {} renderList(); }
function expand(v) { issues.forEach(i => open[i.number] = v); try { localStorage.setItem("tracker.open", JSON.stringify(open)); } catch (e) {} renderList(); }
function pick(n) {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  dirty = false; sel = n; renderList(); renderDetail(byNum[n]); document.body.classList.add("showdetail");
}

function splitBody(b) { b = b || ""; const k = b.indexOf(NOTES.trim()); return k < 0 ? [b.trim(), ""] : [b.slice(0, k).trim(), b.slice(k + NOTES.trim().length).trim()]; }
function md(s) { return DOMPurify.sanitize(marked.parse(s || "")); }

function renderDetail(i) {
  const [desc, notes] = splitBody(i.body);
  const s = claudeState(i), t = typeOf(i), mod = modOf(i);
  const parents = issues.filter(p => p.number !== i.number && ["epic", "story"].includes(typeOf(p)) && p.state === "OPEN");
  const model = (i.labels.find(l => l.startsWith("model:")) || "").slice(6);
  const stat = i.state === "CLOSED" ? "done" : has(i, "later") ? "later" : "open";
  $("detail").innerHTML = `
  <div class="toprow"><button id="back" onclick="document.body.classList.remove('showdetail')">← List</button>
    ${i.parent && byNum[i.parent] ? `<a href="#" onclick="pick(${i.parent});return false">${esc(byNum[i.parent].title)}</a>` : ""}</div>
  <div class="toprow" style="margin-top:8px"><span>#${i.number} · updated ${new Date(i.updatedAt).toLocaleString()}</span>
    <a href="${i.url}" target="_blank" rel="noopener">GitHub</a><span class="grow"></span>
    <span id="dirty"></span><button class="primary" onclick="save()">Save</button></div>
  <div class="field"><input id="f-title" value="${esc(i.title)}" oninput="markDirty()"></div>
  <div class="grid">
    <div><label>Type</label><select id="f-type" onchange="markDirty()">${TYPES.map(x => `<option ${x === t ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div><label>Priority</label><select id="f-prio" onchange="markDirty()">${["P1", "P2", "P3"].map(x => `<option ${x === prioOf(i) ? "selected" : ""}>${x}</option>`).join("")}</select></div>
    <div><label>Status</label><select id="f-status" onchange="markDirty()">${[["open", "Open"], ["later", "Later"], ["done", "Done"]].map(([v, n]) => `<option value="${v}" ${v === stat ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div><label>Mod (folder)</label><input id="f-mod-i" value="${esc((i.labels.find(l => l.startsWith("mod:")) || "").slice(4))}" placeholder="${esc(mod) || "inherits from parent"}" oninput="markDirty()"></div>
    <div style="grid-column: span 2"><label>Parent</label><select id="f-parent" onchange="markDirty()"><option value="">(none)</option>${parents.map(p => `<option value="${p.number}" ${p.number === i.parent ? "selected" : ""}>#${p.number} ${esc(p.title)}</option>`).join("")}</select></div>
    <div style="grid-column: span 2"><label>Labels (comma separated)</label><input id="f-labels" value="${esc(i.labels.filter(l => !/^(type:|P[123]$|mod:|model:|later$|claude$|working$|ready$|failed$|for-damrus$)/.test(l)).join(", "))}" oninput="markDirty()"></div>
  </div>
  <div class="field"><label>Description</label><textarea id="f-desc" rows="7" oninput="markDirty()">${esc(desc)}</textarea></div>
  <div class="box"><div class="head"><b>${STATE_TEXT[s]}</b>
      ${s === "working" ? "" : s === "claude" ? `<button onclick="setClaude(false)">Unmark</button>` : `<button class="primary" onclick="setClaude(true)">Mark for Claude</button>`}</div>
    <div class="grid" style="grid-template-columns: 1fr 2fr"><div><label>Model</label><select id="f-model" onchange="markDirty()">
      ${[["", "Dispatcher picks"], ["haiku", "Haiku"], ["sonnet", "Sonnet"], ["opus", "Opus"]].map(([v, n]) => `<option value="${v}" ${v === model ? "selected" : ""}>${n}</option>`).join("")}</select></div></div>
    <label style="color:var(--muted);font-size:12px">Instructions / notes for Claude</label>
    <textarea id="f-notes" rows="4" oninput="markDirty()">${esc(notes)}</textarea></div>
  <div class="sec">Screenshots &amp; files</div>
  <div class="drop" id="drop">Paste (Ctrl+V), drop images here, or <label style="color:var(--accent);cursor:pointer;text-decoration:underline">browse<input type="file" accept="image/*" multiple hidden onchange="uploadFiles(this.files)"></label></div>
  <div class="shots" id="shots"></div>
  <div class="sec">Comments (${i.comments.totalCount})</div>
  <div id="comments"><div class="empty">Loading…</div></div>
  <textarea id="f-comment" rows="3" placeholder="Add a comment… (Ctrl+Enter to post)"></textarea>
  <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
    <button class="primary" onclick="postComment()">Comment</button>
    <label><input type="checkbox" id="f-tc"> also send to Claude</label></div>`;
  $("f-comment").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) postComment(); });
  const drop = $("drop");
  drop.addEventListener("dragover", e => e.preventDefault());
  drop.addEventListener("drop", e => { e.preventDefault(); uploadFiles(e.dataTransfer.files); });
  showShots(i); loadComments(i);
}
function markDirty() { dirty = true; $("dirty").innerHTML = `<span class="dirty">Unsaved</span>`; }

async function withImages(root) {
  // Images stored in the private repo (attachments/...) need the token to load.
  for (const img of root.querySelectorAll("img")) {
    const src = img.getAttribute("src") || "";
    if (/^attachments\//.test(src)) {
      try { img.src = URL.createObjectURL(await api(`${R()}/contents/${src}`, { accept: "application/vnd.github.raw" })); } catch (e) { img.alt = "missing " + src; }
      img.onclick = () => window.open(img.src);
    }
  }
}
function showShots(i) {
  const srcs = [...(i.body || "").matchAll(/!\[[^\]]*\]\((attachments\/[^)\s]+)\)/g)].map(m => m[1]);
  $("shots").innerHTML = srcs.map(s => `<img src="${esc(s)}">`).join("");
  withImages($("shots"));
}
async function loadComments(i) {
  try {
    const d = await gql(`query($o:String!,$n:String!,$num:Int!){repository(owner:$o,name:$n){issue(number:$num){comments(first:100){nodes{body createdAt author{login}}}}}}`,
      { o: cfg.owner, n: cfg.repo, num: i.number });
    const cs = d.repository.issue.comments.nodes;
    $("comments").innerHTML = cs.map(c => `<div class="comment"><div class="who">${esc(c.author?.login)} · ${new Date(c.createdAt).toLocaleString()}
      ${c.body.startsWith(TO_CLAUDE) ? `<span class="tc">· sent to Claude</span>` : ""}</div><div class="md">${md(c.body.replace(TO_CLAUDE, ""))}</div></div>`).join("") || `<div class="empty">No comments.</div>`;
    withImages($("comments"));
  } catch (e) { $("comments").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function collectLabels(i) {
  const keepStatus = i.labels.filter(l => /^(claude|working|ready|failed|for-damrus)$/.test(l));
  const extra = $("f-labels").value.split(",").map(s => s.trim()).filter(Boolean);
  const mod = $("f-mod-i").value.trim(), model = $("f-model").value, st = $("f-status").value;
  return [...new Set(["type:" + $("f-type").value, $("f-prio").value, ...(mod ? ["mod:" + mod] : []),
    ...(model ? ["model:" + model] : []), ...(st === "later" ? ["later"] : []), ...keepStatus, ...extra])];
}
async function setParent(i, parentNum) {
  if ((i.parent || null) === parentNum) return;
  if (i.parent) await api(`${R()}/issues/${i.parent}/sub_issue`, { method: "DELETE", body: JSON.stringify({ sub_issue_id: i.databaseId }) });
  if (parentNum) await api(`${R()}/issues/${parentNum}/sub_issues`, { method: "POST", body: JSON.stringify({ sub_issue_id: i.databaseId, replace_parent: true }) });
}
async function save() {
  const i = byNum[sel]; if (!i) return;
  status("Saving…");
  try {
    const notes = $("f-notes").value.trim(), st = $("f-status").value;
    const body = $("f-desc").value.trim() + (notes ? NOTES + notes : "");
    await api(`${R()}/issues/${i.number}`, { method: "PATCH", body: JSON.stringify({
      title: $("f-title").value.trim(), body, labels: collectLabels(i), state: st === "done" ? "closed" : "open" }) });
    await setParent(i, +$("f-parent").value || null);
    dirty = false; await load();
  } catch (e) { status("Save failed: " + e.message); }
}
async function setClaude(on) {
  const i = byNum[sel];
  if (dirty) await save();
  status(on ? "Marking for Claude…" : "Unmarking…");
  try {
    if (on) {
      await api(`${R()}/issues/${i.number}/labels`, { method: "POST", body: JSON.stringify({ labels: ["claude"] }) });
      for (const l of ["failed", "for-damrus", "ready"]) if (has(i, l)) await api(`${R()}/issues/${i.number}/labels/${l}`, { method: "DELETE" });
    } else await api(`${R()}/issues/${i.number}/labels/claude`, { method: "DELETE" });
    await load();
  } catch (e) { status("Error: " + e.message); }
}
async function postComment() {
  const i = byNum[sel], text = $("f-comment").value.trim(); if (!text) return;
  status("Posting…");
  try {
    await api(`${R()}/issues/${i.number}/comments`, { method: "POST", body: JSON.stringify({ body: ($("f-tc").checked ? TO_CLAUDE + "\n" : "") + text }) });
    $("f-comment").value = ""; await load(); loadComments(byNum[i.number]);
  } catch (e) { status("Error: " + e.message); }
}
async function uploadFiles(files) {
  const i = byNum[sel]; if (!i) return;
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    status("Uploading " + f.name + "…");
    try {
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(",")[1]); fr.readAsDataURL(f); });
      const ext = (f.type.split("/")[1] || "png").replace("jpeg", "jpg");
      const path = `attachments/${i.number}/${Date.now()}.${ext}`;
      await api(`${R()}/contents/${path}`, { method: "PUT", body: JSON.stringify({ message: `#${i.number}: attach screenshot`, content: b64 }) });
      const cur = byNum[i.number].body || "", [d, n] = splitBody(cur);
      const nb = (d + `\n\n![screenshot](${path})`).trim() + (n ? NOTES + n : "");
      await api(`${R()}/issues/${i.number}`, { method: "PATCH", body: JSON.stringify({ body: nb }) });
      if (!dirty) { await load(); } else { $("f-desc").value += `\n\n![screenshot](${path})`; byNum[i.number].body = nb; showShots(byNum[i.number]); }
    } catch (e) { status("Upload failed: " + e.message); return; }
  }
  status("Uploaded");
}
document.addEventListener("paste", e => {
  if (!sel) return;
  const files = [...e.clipboardData.files].filter(f => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); uploadFiles(files); }
});
async function newIssue() {
  const title = prompt("Title of the new issue:"); if (!title) return;
  const p = sel && byNum[sel] && ["epic", "story"].includes(typeOf(byNum[sel])) ? byNum[sel] : null;
  const type = p ? (typeOf(p) === "epic" ? "story" : "subtask") : "story";
  const mod = p && modOf(p);
  status("Creating…");
  try {
    const r = await api(`${R()}/issues`, { method: "POST", body: JSON.stringify({ title, labels: ["type:" + type, "P2", ...(mod ? ["mod:" + mod] : [])] }) });
    if (p) await api(`${R()}/issues/${p.number}/sub_issues`, { method: "POST", body: JSON.stringify({ sub_issue_id: r.id }) });
    if (p) open[p.number] = true;
    dirty = false; sel = r.number; await load(); renderDetail(byNum[r.number]);
  } catch (e) { status("Error: " + e.message); }
}
document.addEventListener("keydown", e => { if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); $("search").focus(); } });
$("search").addEventListener("input", () => { renderTabs(); renderList(); });
$("f-mod").addEventListener("change", () => { renderTabs(); renderList(); });
window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

function start() {
  if (!cfg.token) { $("login").hidden = false; $("app").hidden = true; $("l-owner").value = cfg.owner || ""; return; }
  $("login").hidden = true; $("app").hidden = false; load();
  setInterval(() => { if (!dirty && document.visibilityState === "visible") load(); }, 60000);
}
start();
</script>
